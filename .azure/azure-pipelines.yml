trigger:
  branches:
    include:
      - main

variables:
  - group: consultants-secrets
  - name: acrName
    value: consultantsregistry
  - name: backendImage
    value: consultants-backend
  - name: frontendImage
    value: consultants-frontend
  - name: tag
    value: $(Build.BuildId)
  - name: JAVA_HOME
    value: 'C:\Users\Antoine\AppData\Local\Programs\Eclipse Adoptium\jdk-17.0.18.8-hotspot'
  - name: PATH
    value: '$(JAVA_HOME)\bin;$(PATH)'

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: Build
        pool:
          name: Default
        steps:
          - script: |
              set JAVA_HOME=C:\Users\Antoine\AppData\Local\Programs\Eclipse Adoptium\jdk-17.0.18.8-hotspot
              set PATH=%JAVA_HOME%\bin;%PATH%
              java -version
              echo JAVA_HOME=%JAVA_HOME%
            displayName: Set up Java 17

          - task: Maven@4
            inputs:
              mavenPomFile: pom.xml
              goals: compile
              javaHomeOption: path
              jdkUserInputPath: 'C:\Users\Antoine\AppData\Local\Programs\Eclipse Adoptium\jdk-17.0.18.8-hotspot'
            displayName: Compile

  - stage: Test
    displayName: Test
    dependsOn: Build
    jobs:
      - job: Test
        pool:
          name: Default
        steps:
          - task: Maven@4
            inputs:
              mavenPomFile: pom.xml
              goals: test
              javaHomeOption: path
              jdkUserInputPath: 'C:\Users\Antoine\AppData\Local\Programs\Eclipse Adoptium\jdk-17.0.18.8-hotspot'
            displayName: Run tests

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
            displayName: Publish test results
            condition: always()
