trigger:
  branches:
    include:
      - main

variables:
  - group: consultants-secrets
  - name: acrName
    value: consultantsregistry
  - name: backendImage
    value: consultants-backend
  - name: frontendImage
    value: consultants-frontend
  - name: tag
    value: $(Build.BuildId)

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: Build
        pool:
          name: Default
        steps:
          - script: |
              echo "##vso[task.setvariable variable=JAVA_HOME]C:\Program Files\Eclipse Adoptium\jdk-17.0.14.7-hotspot"
              echo "##vso[task.prependpath]C:\Program Files\Eclipse Adoptium\jdk-17.0.14.7-hotspot\bin"
            displayName: Set up Java 17

          - script: java -version
            displayName: Check Java version

          - task: Maven@4
            inputs:
              mavenPomFile: pom.xml
              goals: compile
              javaHomeOption: path
              jdkUserInputPath: 'C:\Program Files\Eclipse Adoptium\jdk-17.0.14.7-hotspot'
            displayName: Compile

  - stage: Test
    displayName: Test
    dependsOn: Build
    jobs:
      - job: Test
        pool:
          name: Default
        steps:
          - script: |
              echo "##vso[task.setvariable variable=JAVA_HOME]C:\Program Files\Eclipse Adoptium\jdk-17.0.14.7-hotspot"
              echo "##vso[task.prependpath]C:\Program Files\Eclipse Adoptium\jdk-17.0.14.7-hotspot\bin"
            displayName: Set up Java 17

          - task: Maven@4
            inputs:
              mavenPomFile: pom.xml
              goals: test
              javaHomeOption: path
              jdkUserInputPath: 'C:\Program Files\Eclipse Adoptium\jdk-17.0.14.7-hotspot'
            displayName: Run tests

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
            displayName: Publish test results
            condition: always()
