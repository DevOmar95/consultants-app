trigger:
  branches:
    include:
      - main

variables:
  - group: consultants-secrets
  - name: acrName
    value: consultantsregistry
  - name: backendImage
    value: consultants-backend
  - name: frontendImage
    value: consultants-frontend
  - name: tag
    value: $(Build.BuildId)

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: Build
        pool:
          name: Default
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled
            displayName: Set up Java 17

          - script: mvn compile
            displayName: Compile

  - stage: Test
    displayName: Test
    dependsOn: Build
    jobs:
      - job: Test
        pool:
          name: Default
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled
            displayName: Set up Java 17

          - script: mvn test
            displayName: Run tests

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
            displayName: Publish test results
            condition: always()
