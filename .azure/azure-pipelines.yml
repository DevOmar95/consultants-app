trigger:
  branches:
    include:
      - main

variables:
  - group: consultants-secrets
  - name: acrName
    value: consultantsregistry
  - name: backendImage
    value: consultants-backend
  - name: frontendImage
    value: consultants-frontend
  - name: tag
    value: $(Build.BuildId)
  - name: JAVA_HOME
    value: 'C:\Users\Antoine\AppData\Local\Programs\Eclipse Adoptium\jdk-17.0.18.8-hotspot'

stages:
  - stage: Build
    displayName: '1 - Build'
    jobs:
      - job: BuildJob
        pool:
          name: Default
        steps:
          - checkout: self

          - script: |
              java -version
              mvnw.cmd compile
            displayName: 'Maven Compile'

          - script: |
              cd /d "C:\Users\Antoine\Desktop\React_front_jdk\consultants-frontend"
              npm install
              npm run build
            displayName: 'React Build'

  - stage: Tests
    displayName: '2 - Tests'
    dependsOn: Build
    jobs:
      - job: TestJob
        pool:
          name: Default
        steps:
          - checkout: self

          - script: |
              mvnw.cmd verify
            displayName: 'Run Tests'

  - stage: Quality
    displayName: '3 - Quality (SonarCloud)'
    dependsOn: Tests
    jobs:
      - job: SonarCloudAnalysis
        pool:
          name: Default
        steps:
          - checkout: self

          - task: SonarCloudPrepare@3
            inputs:
              SonarCloud: 'SonarCloudConnection'
              organization: 'omaromr1999'
              scannerMode: 'cli'
              configMode: 'manual'
              cliProjectKey: 'consultants-app'
              cliProjectName: 'consultants-app'
              cliSources: 'src'
              extraProperties: |
                sonar.java.binaries=target/classes
            displayName: 'Prepare SonarCloud Analysis'

          - script: |
              mvnw.cmd verify -DskipTests
            displayName: 'Build for SonarCloud'

          - task: SonarCloudAnalyze@3
            displayName: 'Run SonarCloud Analysis'

          - task: SonarCloudPublish@3
            inputs:
              pollingTimeoutSec: '300'
            displayName: 'Publish SonarCloud Results'

  - stage: DockerBuild
    displayName: '4 - Docker Build'
    dependsOn: Quality
    jobs:
      - job: BuildAndPushImage
        pool:
          name: Default
        steps:
          - checkout: self

          - task: Docker@2
            inputs:
              containerRegistry: 'AzureContainerRegistry'
              repository: 'consultants-backend'
              command: 'buildAndPush'
              Dockerfile: '**/Dockerfile'
              tags: |
                $(Build.BuildId)
                latest
            displayName: 'Build and Push Backend Image to ACR'

  - stage: DeployStaging
    displayName: '5 - Deploy Staging'
    dependsOn: DockerBuild
    jobs:
      - job: DeployToStaging
        pool:
          name: Default
        steps:
          - task: AzureWebAppContainer@1
            inputs:
              azureSubscription: 'AzureServiceConnection'
              appName: 'consultants-staging-api'
              containers: '$(acrName).azurecr.io/consultants-backend:$(Build.BuildId)'
            displayName: 'Deploy to Staging App Service'

          - script: |
              echo "Running smoke test against staging..."
              curl --fail --retry 3 --retry-delay 10 https://consultants-staging-api.azurewebsites.net/actuator/health || exit 1
              echo "Smoke test passed!"
            displayName: 'Smoke Test'

  - stage: DeployProduction
    displayName: '6 - Deploy Production'
    dependsOn: DeployStaging
    jobs:
      - deployment: DeployToProd
        pool:
          name: Default
        environment: 'Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    appName: 'consultants-api'
                    containers: '$(acrName).azurecr.io/consultants-backend:$(Build.BuildId)'
                  displayName: 'Deploy to Production App Service'
