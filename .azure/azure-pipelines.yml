trigger:
  branches:
    include:
      - main

variables:
  - group: consultants-secrets
  - name: acrName
    value: consultantsregistry
  - name: backendImage
    value: consultants-backend
  - name: frontendImage
    value: consultants-frontend
  - name: tag
    value: $(Build.BuildId)
  - name: JAVA_HOME
    value: 'C:\Users\Antoine\AppData\Local\Programs\Eclipse Adoptium\jdk-17.0.18.8-hotspot'

stages:
  - stage: Build
    displayName: '1 - Build (skipped - using existing image)'
    jobs:
      - job: SkipBuild
        pool:
          name: Default
        steps:
          - script: echo "Using existing image consultantsregistry.azurecr.io/consultants-backend:latest"
            displayName: 'Skip build - use existing image'

  - stage: DeployStaging
    displayName: '5 - Deploy Staging'
    dependsOn: Build
    jobs:
      - job: DeployToStaging
        pool:
          name: Default
        steps:
          - task: AzureWebAppContainer@1
            inputs:
              azureSubscription: 'AzureServiceConnection'
              appName: 'consultants-staging-api'
              containers: '$(acrName).azurecr.io/consultants-backend:latest'
            displayName: 'Deploy to Staging App Service'

          - powershell: |
              Write-Host "Waiting 60 seconds for app to start..."
              Start-Sleep -Seconds 60
              $url = "https://consultants-staging-api-ezfzgsahfybxbaay.francecentral-01.azurewebsites.net/actuator/health"
              try {
                $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30
                Write-Host "Smoke test passed! Status: $($response.StatusCode)"
              } catch {
                Write-Host "Smoke test failed: $_"
                exit 1
              }
            displayName: 'Smoke Test'

  - stage: DeployProduction
    displayName: '6 - Deploy Production'
    dependsOn: DeployStaging
    jobs:
      - deployment: DeployToProd
        pool:
          name: Default
        environment: 'Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    appName: 'consultants-api'
                    containers: '$(acrName).azurecr.io/consultants-backend:$(Build.BuildId)'
                  displayName: 'Deploy to Production App Service'
