trigger:
  branches:
    include:
      - main

variables:
  - group: consultants-secrets
  - name: acrName
    value: consultantsregistry
  - name: backendImage
    value: consultants-backend
  - name: frontendImage
    value: consultants-frontend
  - name: tag
    value: $(Build.BuildId)
  - name: JAVA_HOME
    value: 'C:\Users\Antoine\AppData\Local\Programs\Eclipse Adoptium\jdk-17.0.18.8-hotspot'

stages:
  - stage: Build
    displayName: '1 - Build'
    jobs:
      - job: BuildJob
        pool:
          name: Default
        steps:
          - checkout: self

          - script: |
              java -version
              mvnw.cmd compile
            displayName: 'Maven Compile'

          - script: |
              cd /d "C:\Users\Antoine\Desktop\React_front_jdk\consultants-frontend"
              npm install
              npm run build
            displayName: 'React Build'

  - stage: Tests
    displayName: '2 - Tests'
    dependsOn: Build
    jobs:
      - job: TestJob
        pool:
          name: Default
        steps:
          - checkout: self

          - script: |
              mvnw.cmd verify
            displayName: 'Run Tests'

  - stage: Quality
    displayName: '3 - Quality (SonarCloud)'
    dependsOn: Tests
    jobs:
      - job: SonarCloudAnalysis
        pool:
          name: Default
        steps:
          - checkout: self
            fetchDepth: 0

          - script: |
              SET JAVA_HOME=C:\Users\Antoine\AppData\Local\Programs\Eclipse Adoptium\jdk-17.0.18.8-hotspot
              mvnw.cmd verify sonar:sonar ^
                -Dsonar.projectKey=consultants-app ^
                -Dsonar.organization=antoine-laurentt ^
                -Dsonar.host.url=https://sonarcloud.io ^
                -Dsonar.token=$(SONAR_TOKEN) ^
                -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            displayName: 'SonarCloud Analysis'

  - stage: DockerBuild
    displayName: '4 - Docker Build'
    dependsOn: Quality
    jobs:
      - job: BuildAndPushImage
        pool:
          name: Default
        steps:
          - checkout: self

          - task: Docker@2
            inputs:
              containerRegistry: 'AzureContainerRegistry'
              repository: 'consultants-backend'
              command: 'buildAndPush'
              Dockerfile: '**/Dockerfile'
              tags: |
                $(Build.BuildId)
                latest
            displayName: 'Build and Push Backend Image to ACR'

  - stage: DeployStaging
    displayName: '5 - Deploy Staging'
    dependsOn: DockerBuild
    jobs:
      - job: DeployToStaging
        pool:
          name: Default
        steps:
          - task: AzureWebAppContainer@1
            inputs:
              azureSubscription: 'AzureServiceConnection'
              appName: 'consultants-staging-api'
              containers: '$(acrName).azurecr.io/consultants-backend:$(Build.BuildId)'
            displayName: 'Deploy to Staging App Service'

          - powershell: |
              Write-Host "Waiting 300 seconds for app to start..."
              Start-Sleep -Seconds 300

              $url = "https://consultants-staging-api-ezfzgsahfybxbaay.francecentral-01.azurewebsites.net/actuator/health"
              $maxRetries = 10
              $retryCount = 0

              while ($retryCount -lt $maxRetries) {
                try {
                  Write-Host "Attempt $($retryCount + 1) of $maxRetries"

                  $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 60

                  $json = $response.Content | ConvertFrom-Json
                  if ($response.StatusCode -eq 200 -and $json.status -eq "UP") {
                    Write-Host "Smoke test passed!"
                    exit 0
                  } else {
                    Write-Host "Unexpected response - Status: $($response.StatusCode)"
                  }

                } catch {
                  Write-Host "Not ready. Waiting 30 seconds..."
                }

                $retryCount++
                Start-Sleep -Seconds 30
              }

              Write-Host "Smoke test failed after $maxRetries attempts"
              exit 1
            displayName: 'Smoke Test'
            timeoutInMinutes: 15

  - stage: DeployProduction
    displayName: '6 - Deploy Production'
    dependsOn: DeployStaging
    jobs:
      - deployment: DeployToProd
        pool:
          name: Default
        environment: 'Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    appName: 'consultants-api'
                    containers: '$(acrName).azurecr.io/consultants-backend:$(Build.BuildId)'
                  displayName: 'Deploy to Production App Service'
