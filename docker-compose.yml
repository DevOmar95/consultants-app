version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: consultants-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: consultantsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - consultants-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: consultants-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - consultants-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: consultants-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - consultants-net

  backend:
    build: ./backend
    container_name: consultants-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/consultantsdb
      DB_USER: postgres
      DB_PASS: postgres
      KAFKA_SERVERS: kafka:9092
      JWT_SECRET: mySecretKey1234567890mySecretKey1234567890
    networks:
      - consultants-net

  frontend:
    build: ./frontend
    container_name: consultants-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - consultants-net

  prometheus:
    image: prom/prometheus
    container_name: consultants-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - consultants-net

  grafana:
    image: grafana/grafana
    container_name: consultants-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - consultants-net

networks:
  consultants-net:
    driver: bridge

volumes:
  postgres_data: