spring.application.name=consultants-api
server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/consultantsdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:#{null}}
spring.autoconfigure.exclude=${KAFKA_EXCLUDE:}

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true